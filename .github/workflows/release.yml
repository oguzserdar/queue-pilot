# Two steps, so a person checks every release before it ships:
# 1. A pushed vX.Y.Z tag (made by `pnpm release`) opens a DRAFT GitHub Release: that version's CHANGELOG notes first,
#    then GitHub's generated list of changes and the compare link. Attach the day's video to the draft.
# 2. Publishing the draft builds the Docker image: native amd64 and arm64 builds merged into one tag on GHCR, scanned,
#    smoke-tested, given signed build provenance, and only then tagged `latest` (never for a prerelease).
name: Release
on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  notes:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || (echo "CHANGELOG.md has no section for $version" && exit 1)
          title=$(grep -m1 "^## \[$version\]" CHANGELOG.md | sed -E 's/^## \[[^]]+\] - [0-9-]+ ?//')
          pre=""; case "$version" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" --title "$TAG${title:+ $title}" --notes-file notes.md --generate-notes --draft --verify-tag $pre

  image:
    if: github.event_name == 'release'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for the merge
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*

  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # The merged image first gets only a candidate tag; version tags are added after the scan and smoke test pass.
      - name: Merge both platforms into one candidate image
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools create -t "$IMAGE:candidate-$GITHUB_RUN_ID" $(printf "$IMAGE@sha256:%s " *)
          echo "DIGEST=$(docker buildx imagetools inspect "$IMAGE:candidate-$GITHUB_RUN_ID" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_ENV"
      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ env.DIGEST }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ env.DIGEST }}
        run: |
          docker run -d --name qp -p 3000:3000 -e MIGRATE_ON_START=0 "$IMAGE"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 2; done
          docker logs qp; exit 1
      - name: Signed build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Tag the version, now that it passed
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: docker buildx imagetools create $(printf -- '-t %s ' $TAGS) "$IMAGE@$DIGEST"
      - name: Tag latest (stable releases only)
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"
