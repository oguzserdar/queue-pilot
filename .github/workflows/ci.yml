# Every pull request and every push to main: typecheck, tests (Postgres runs in-process through PGLite), migrations in
# sync with the schema, copy rules on user-facing text, a changelog line for code changes, and a production build.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle || (echo "Schema changed without a migration: run pnpm db:generate and commit it." && exit 1)
      - name: Copy rules
        run: python3 scripts/copy-gate.py README.md CHANGELOG.md ROADMAP.md CONTRIBUTING.md

  changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no changelog')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Code changes come with a changelog line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          if echo "$changed" | grep -qE '^(src|drizzle|scripts)/' && ! echo "$changed" | grep -qx CHANGELOG.md; then
            echo "Add a line under Unreleased in CHANGELOG.md, or label the PR 'no changelog'."
            exit 1
          fi

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # The release only tags an image that starts and answers its health check. Build and start it here too, so a broken
  # image is caught on the push that breaks it instead of at release time.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t qp:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name qp -p 3000:3000 -e MIGRATE_ON_START=0 qp:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 2; done
          docker logs qp; exit 1
