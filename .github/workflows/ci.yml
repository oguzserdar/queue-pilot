# Every pull request and every push to main: typecheck, tests (Postgres runs in-process through PGLite), migrations in
# sync with the schema, copy rules on user-facing text, a changelog line for code changes, and a production build.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle || (echo "Schema changed without a migration: run pnpm db:generate and commit it." && exit 1)
      - name: Copy rules
        run: python3 scripts/copy-gate.py README.md CHANGELOG.md ROADMAP.md CONTRIBUTING.md

  changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no changelog')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Code changes come with a changelog line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          if echo "$changed" | grep -qE '^(src|drizzle|scripts)/' && ! echo "$changed" | grep -qx CHANGELOG.md; then
            echo "Add a line under Unreleased in CHANGELOG.md, or label the PR 'no changelog'."
            exit 1
          fi

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # A self-hoster's first run, as the README describes it: copy .env.example, fill in the required values, run
  # docker compose up. Passes only when the image builds, the migrations apply to a real Postgres, the app reports
  # ready and the home page loads. A broken image or migration is caught on the push that breaks it.
  self-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fill in .env the way the README says
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^SETTINGS_KEY=.*|SETTINGS_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^CRON_SECRET=.*|CRON_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
      - name: docker compose up
        run: docker compose up -d --build app db
      - name: The app reports ready, with the database reachable
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/api/health/ready && exit 0; sleep 3; done
          docker compose logs app; exit 1
      - name: Every migration was applied
        run: |
          files=$(ls drizzle/*.sql | wc -l)
          applied=$(docker compose exec -T db psql -U queuepilot -d queuepilot -tAc 'select count(*) from public."__drizzle_migrations__"')
          echo "migrations in repo: $files, applied: $applied"
          test "$files" -eq "$applied"
      - name: The home page loads (the example account)
        run: curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3000/
      - name: Logs on failure
        if: failure()
        run: docker compose logs
