# Run Queue Pilot on your own machine or server: copy .env.example to .env, fill it in (each line says how to
# generate its value), then `docker compose up -d`. Check it with /api/health/ready.
# Postgres keeps its data in the `db` volume. The `cron` service calls the daily job the way Vercel Cron does.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://queuepilot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/queuepilot
    # With no proxy in front, leave TRUSTED_PROXY_HOP_COUNT unset (0). Behind a reverse proxy, set the number of
    # proxies that append to X-Forwarded-For, or list them in TRUSTED_PROXIES.
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: queuepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: queuepilot
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuepilot"]
      interval: 5s
      retries: 10

  cron:
    image: curlimages/curl:8.23.0
    restart: unless-stopped
    env_file: .env
    depends_on:
      - app
    # Every 30 seconds: send direct posts whose time has come (one small query when nothing is due), at most 50 s
    # per call so a slow run never stops the next ones.
    # Daily, at or after 17:00 UTC like vercel.json: copies of published Buffer posts and the overdue sweep. It runs
    # in the background so it never delays the 30-second check, and the day counts as done only when it succeeds,
    # so a failure, or a host that starts at 17:01, still gets that day's run. /tmp/echo-started holds when the
    # current daily run began; a run older than 6 minutes (cut off by a restart) no longer blocks a new one.
    entrypoint: ["sh", "-c", "while true; do curl -fsS -m 50 -o /dev/null -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/due || true; today=$$(date -u +%F); now=$$(date -u +%s); started=$$(cat /tmp/echo-started 2>/dev/null || echo 0); if [ $$(date -u +%H%M) -ge 1700 ] && [ \"$$(cat /tmp/echo-day 2>/dev/null)\" != \"$$today\" ] && [ $$((now - started)) -gt 360 ]; then echo $$now > /tmp/echo-started; (curl -fsS -m 300 -o /dev/null -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/echo && echo $$today > /tmp/echo-day; echo 0 > /tmp/echo-started) & fi; sleep 30; done"]

volumes:
  db:
